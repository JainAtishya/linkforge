<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>LinkForge</title>
    <meta
      name="description"
      content="LinkForge lets you shorten URLs, track click analytics, and share clean branded links — all in one place."
    />
    <meta name="theme-color" content="#863bff" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LinkForge — Smart Link Shortener" />
    <meta
      property="og:description"
      content="Shorten URLs, track analytics, and share clean branded links with LinkForge."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LinkForge — Smart Link Shortener" />
    <meta
      name="twitter:description"
      content="Shorten URLs, track analytics, and share clean branded links with LinkForge."
    />
  </head>
